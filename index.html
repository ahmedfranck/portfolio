  <body>
    <div id="root"></div>
    <!--
      Formulaire statique miroir, requis pour que Netlify détecte le formulaire "contact"
      au moment du build (les formulaires rendus uniquement par React ne sont pas visibles
      par l'analyseur HTML de Netlify). Les champs doivent correspondre exactement à ceux
      du composant src/components/ContactForm.tsx. Jamais affiché côté utilisateur.
    -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
